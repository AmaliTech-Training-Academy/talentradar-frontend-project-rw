name: Build, Coverage, and Deploy Report
on:
  pull_request:
    branches:
      - development
      - staging
jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 8

      - name: Install Vitest
        run: |
          pnpm install -D c8 vitest @vitest/runner @vitest/coverage-v8

      - name: Run tests with Vitest
        run: pnpm exec vitest run --coverage --passWithNoTests
        continue-on-error: true

      - name: Upload Vitest coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: coverage/lcov-report
          retention-days: 1

  deploy-coverage:
    runs-on: ubuntu-latest
    needs: build-test-coverage
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Vitest coverage
        uses: actions/download-artifact@v4
        with:
          name: vitest-coverage
          path: gh-pages-deploy/

      - name: Get gh-pages history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy
          force_orphan: true
